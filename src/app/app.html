<a class="skip-link" href="#main-content">Skip to content</a>

<div class="shell">

  <nav class="icon-rail" aria-label="Primary">
    <a class="rail-logo" routerLink="/overview" aria-label="Elektraweb Documentation home">
      <img
        ngSrc="elektraweb-logo.png"
        width="450"
        height="81"
        priority
        alt="Elektraweb"
        class="rail-logo-img"
      />
    </a>
  </nav>

  <aside class="sidebar" aria-label="Documentation sections">
    <p class="sidebar-title">Documentation</p>
    <app-search-box />
    <app-nav-list [items]="navSections" [expanded]="expanded()" (itemToggled)="toggle($event)" />
  </aside>

  <main class="content" id="main-content" tabindex="-1">
    <router-outlet />
  </main>

</div>
