<a class="skip-link" href="#main-content">Skip to content</a>

<button
  type="button"
  class="nav-toggle-mobile"
  [attr.aria-expanded]="mobileNavOpen()"
  aria-controls="sidebar-nav"
  aria-label="Toggle navigation menu"
  (click)="toggleMobileNav()"
>
  <span class="hamburger" aria-hidden="true"></span>
</button>

@if (mobileNavOpen()) {
  <button type="button" class="nav-backdrop" aria-label="Close navigation menu" (click)="toggleMobileNav()"></button>
}

<div class="shell">
  <aside class="sidebar" id="sidebar-nav" [class.open]="mobileNavOpen()" aria-label="Documentation navigation">
    <a class="sidebar-logo" routerLink="/overview" aria-label="Elektraweb Documentation home">
      <img ngSrc="elektraweb-logo.png" width="450" height="81" priority alt="Elektraweb" class="sidebar-logo-img" />
    </a>

    <app-search-box />

    <p class="sidebar-title">Documentation</p>
    <app-nav-list [items]="navSections" [expanded]="expanded()" (itemToggled)="toggle($event)" />
  </aside>

  <main class="content" id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
