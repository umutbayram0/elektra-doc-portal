<a class="skip-link" href="#main-content">Skip to content</a>

<button
  type="button"
  class="nav-toggle-mobile"
  [attr.aria-expanded]="mobileNavOpen()"
  aria-controls="sidebar-nav"
  aria-label="Toggle navigation menu"
  (click)="toggleMobileNav()"
>
  <span class="hamburger" aria-hidden="true"></span>
</button>

@if (mobileNavOpen()) {
  <button
    type="button"
    class="nav-backdrop"
    aria-label="Close navigation menu"
    (click)="toggleMobileNav()"
  ></button>
}

<div class="shell">
  <aside
    class="sidebar"
    id="sidebar-nav"
    [class.open]="mobileNavOpen()"
    aria-label="Documentation navigation"
  >
    <a class="sidebar-logo" routerLink="/overview" aria-label="Elektraweb Documentation home">
      <img
        ngSrc="elektraweb-logo.png"
        width="450"
        height="81"
        priority
        alt="Elektraweb"
        class="sidebar-logo-img"
      />
    </a>

    <app-search-box />

    @if (activeSection(); as section) {
      <a class="sidebar-back" routerLink="/overview">
        <span aria-hidden="true">&larr;</span> All documentation
      </a>
      <a class="sidebar-title sidebar-section-link" [routerLink]="'/' + section.path">{{
        section.label
      }}</a>
      <app-nav-list
        [items]="section.children ?? []"
        [expanded]="expanded()"
        (itemToggled)="toggle($event)"
      />
    } @else {
      <p class="sidebar-title">Documentation</p>
      <ul class="sidebar-root-list">
        @for (item of navSections; track item.path) {
          <li>
            <a class="sidebar-root-link" [routerLink]="'/' + item.path">
              {{ item.label }}
              <span class="chevron" aria-hidden="true">&rsaquo;</span>
            </a>
          </li>
        }
      </ul>
    }
  </aside>

  <main class="content" id="main-content" tabindex="-1" #mainContent [attr.lang]="pageLang()">
    <router-outlet />
  </main>
</div>
