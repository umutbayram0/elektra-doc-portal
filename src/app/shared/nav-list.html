<ng-template #list let-navItems>
  <ul class="nav-list">
    @for (item of navItems; track item.path) {
      <li>
        <div class="nav-row">
          <a
            class="nav-link"
            [routerLink]="'/' + item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="activeOptions(item)"
          >
            {{ item.label }}
          </a>

          @if (item.children && item.children.length > 0) {
            <button
              type="button"
              class="nav-toggle"
              [attr.aria-expanded]="expanded().has(item.path)"
              [attr.aria-label]="
                (expanded().has(item.path) ? 'Collapse ' : 'Expand ') + item.label + ' section'
              "
              (click)="itemToggled.emit(item)"
            >
              <span class="chevron" [class.expanded]="expanded().has(item.path)" aria-hidden="true">
                &rsaquo;
              </span>
            </button>
          }
        </div>

        @if (item.children && item.children.length > 0 && expanded().has(item.path)) {
          <div class="nav-children">
            <ng-container *ngTemplateOutlet="list; context: { $implicit: item.children }" />
          </div>
        }
      </li>
    }
  </ul>
</ng-template>

<ng-container *ngTemplateOutlet="list; context: { $implicit: items() }" />
